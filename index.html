<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Крестики-нолики</title>
  </head>
  <body>
    <div id="app">
      <section id="screen-menu" class="screen">
        <h1>Крестики-нолики</h1>
        <svg
          class="title-ornament"
          viewBox="0 0 168 14"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M6 7 H70 M98 7 H162"
            fill="none"
            stroke="#a5885e"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path d="M84 1.5 L88.5 7 L84 12.5 L79.5 7 Z" fill="#c98a3f" />
        </svg>
        <button id="menu-pvp" type="button">Против игрока</button>
        <button id="menu-pve" type="button">Против AI</button>
        <button id="menu-achievements" type="button">Достижения</button>
        <button id="menu-stats" type="button">Статистика</button>
        <button id="menu-settings" type="button">Настройки</button>
      </section>

      <section id="screen-setup" class="screen" hidden>
        <h2>Новая партия</h2>
        <fieldset id="ai-difficulty" hidden>
          <legend>Сложность AI</legend>
          <label><input type="radio" name="difficulty" value="easy" /> Easy</label>
          <label><input type="radio" name="difficulty" value="medium" checked /> Medium</label>
          <label><input type="radio" name="difficulty" value="hard" /> Hard</label>
          <label><input type="radio" name="difficulty" value="impossible" /> Impossible</label>
        </fieldset>
        <fieldset id="pve-side" hidden>
          <legend>Вы играете за</legend>
          <label><input type="radio" name="side" value="X" checked /> X</label>
          <label><input type="radio" name="side" value="O" /> O</label>
        </fieldset>
        <fieldset>
          <legend>Таймер на ход</legend>
          <label><input type="radio" name="timer" value="0" checked /> Без таймера</label>
          <label><input type="radio" name="timer" value="5" /> 5 секунд</label>
          <label><input type="radio" name="timer" value="10" /> 10 секунд</label>
          <label><input type="radio" name="timer" value="30" /> 30 секунд</label>
        </fieldset>
        <fieldset>
          <legend>Формат</legend>
          <label><input type="radio" name="format" value="single" checked /> Одна партия</label>
          <label><input type="radio" name="format" value="bestOf3" /> Best of 3</label>
          <label><input type="radio" name="format" value="bestOf5" /> Best of 5</label>
        </fieldset>
        <fieldset>
          <legend>Кто начинает</legend>
          <label><input type="radio" name="starter" value="X" checked /> X</label>
          <label><input type="radio" name="starter" value="O" /> O</label>
        </fieldset>
        <div class="row">
          <button id="setup-back" type="button">Назад</button>
          <button id="setup-start" type="button">Начать</button>
        </div>
      </section>

      <section id="screen-achievements" class="screen" hidden>
        <h2>Достижения</h2>
        <div id="achievements-body"></div>
        <button id="achievements-back" type="button">Назад</button>
      </section>

      <section id="screen-stats" class="screen" hidden>
        <h2>Статистика</h2>
        <div id="stats-body"></div>
        <button id="stats-back" type="button">Назад</button>
      </section>

      <section id="screen-settings" class="screen" hidden>
        <h2>Настройки</h2>
        <fieldset>
          <legend>Звук</legend>
          <label><input type="checkbox" id="sfx-toggle" checked /> Эффекты (SFX)</label>
          <label><input type="checkbox" id="music-toggle" checked /> Музыка</label>
        </fieldset>
        <button id="settings-back" type="button">Назад</button>
      </section>

      <section id="screen-game" class="screen" hidden>
        <p id="series-info" hidden></p>
        <div id="board-wrap">
          <canvas id="game-canvas" width="360" height="360"></canvas>
          <div id="result-overlay" hidden>
            <div class="result-card">
              <p id="result-title"></p>
              <p id="result-sub" hidden></p>
              <div class="row">
                <button id="result-menu" type="button">В меню</button>
                <button id="result-next" type="button"></button>
              </div>
            </div>
          </div>
        </div>
        <div id="side">
          <div id="turn-row">
            <p id="status" aria-live="polite">Ход: X</p>
            <p id="turn-timer" hidden></p>
          </div>
          <p id="hint" role="status"></p>
          <div id="controls">
            <button id="restart" type="button">Заново</button>
            <button id="to-menu" type="button">В меню</button>
          </div>
        </div>
      </section>
    </div>
    <div id="achievement-overlay" role="dialog" aria-modal="true" hidden>
      <div class="achievement-card">
        <p class="achievement-kicker">Достижение получено!</p>
        <span id="achievement-icon" aria-hidden="true"></span>
        <p id="achievement-title"></p>
        <p id="achievement-desc"></p>
        <p id="achievement-gain"></p>
        <button id="achievement-close" type="button">Классно!</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
