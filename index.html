<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Крестики-нолики</title>
  </head>
  <body>
    <div id="app">
      <section id="screen-menu" class="screen">
        <h1>Крестики-нолики</h1>
        <button id="menu-pvp" type="button">Против игрока</button>
        <button id="menu-pve" type="button">Против AI</button>
      </section>

      <section id="screen-setup" class="screen" hidden>
        <h2>Новая партия</h2>
        <fieldset id="ai-difficulty" hidden>
          <legend>Сложность AI</legend>
          <label><input type="radio" name="difficulty" value="easy" /> Easy</label>
          <label><input type="radio" name="difficulty" value="medium" checked /> Medium</label>
          <label><input type="radio" name="difficulty" value="hard" /> Hard</label>
          <label><input type="radio" name="difficulty" value="impossible" /> Impossible</label>
        </fieldset>
        <fieldset>
          <legend>Формат</legend>
          <label><input type="radio" name="format" value="single" checked /> Одна партия</label>
          <label><input type="radio" name="format" value="bestOf3" /> Best of 3</label>
          <label><input type="radio" name="format" value="bestOf5" /> Best of 5</label>
        </fieldset>
        <fieldset>
          <legend>Кто начинает</legend>
          <label><input type="radio" name="starter" value="X" checked /> X</label>
          <label><input type="radio" name="starter" value="O" /> O</label>
        </fieldset>
        <div class="row">
          <button id="setup-back" type="button">Назад</button>
          <button id="setup-start" type="button">Начать</button>
        </div>
      </section>

      <section id="screen-game" class="screen" hidden>
        <p id="series-info" hidden></p>
        <canvas id="game-canvas" width="360" height="360"></canvas>
        <div id="side">
          <p id="status" aria-live="polite">Ход: X</p>
          <p id="hint" role="status"></p>
          <div id="controls">
            <button id="restart" type="button">Заново</button>
            <button id="to-menu" type="button">В меню</button>
          </div>
        </div>
      </section>

      <section id="screen-result" class="screen" hidden>
        <p id="result-title"></p>
        <p id="result-sub" hidden></p>
        <div class="row">
          <button id="result-menu" type="button">В меню</button>
          <button id="result-next" type="button"></button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
