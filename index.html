<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Крестики-нолики</title>
  </head>
  <body>
    <div id="app">
      <main>
        <canvas id="game-canvas" width="360" height="360"></canvas>
        <p id="status" aria-live="polite">Ход: X</p>
        <p id="hint" role="status"></p>
        <div id="controls">
          <button id="start-x" type="button">Начать за X</button>
          <button id="start-o" type="button">Начать за O</button>
          <button id="restart" type="button">Заново</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
